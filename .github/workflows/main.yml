
name: Build IRN Chat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='www' \
            --exclude='android' \
            ./ www/

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Initialize Capacitor
        run: |
          npx cap init "IRN Chat" "com.mymessenger.app" --web-dir=www

      - name: Add Android
        run: npx cap add android

      - name: Generate App Icon
        run: |
          test -f resources/icon.png
          npx capacitor-assets generate --android

      - name: Sync Android
        run: npx cap sync android

      - name: Fix Kotlin dependencies
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion "1.8.22"
                          details.because "Align Kotlin dependencies"
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRN-Chat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
