<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRN Chat Pro | Fixed</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
        * { box-sizing: border-box; }
        body { margin: 0; height: 100vh; font-family: 'Vazirmatn', Tahoma; background: #0b1a2f; color: white; overflow: hidden; }
        .hidden { display: none !important; }
        .page { height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        .header { background: #1a3a5a; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        button { background: #008cff; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-family: 'Vazirmatn'; }
        input { padding: 10px; border-radius: 6px; border: none; outline: none; flex: 1; }
        .box { display: flex; gap: 5px; margin-top: 8px; }
        .messages { flex: 1; background: #050505; border-radius: 8px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; }
        .msg { background: #222; padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; max-width: 80%; position: relative; }
        .msg.mine { align-self: flex-end; background: #005fa3; }
        .name { color: #00aaff; font-size: 11px; margin-bottom: 3px; }
        .msg.mine .name { color: #abdfff; text-align: left; }
        .actions { margin-top: 5px; font-size: 10px; display: flex; gap: 5px; }
        .tick { color: #00ff00; }
        .delete { background: #c0392b; padding: 2px 5px; }
        .private { display: flex; flex: 1; gap: 8px; overflow: hidden; }
        .users { width: 200px; background: #111; border-radius: 8px; overflow-y: auto; }
        .user { padding: 12px; border-bottom: 1px solid #333; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .user:hover { background: #1a3a5a; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .online { background: #00ff00; }
        .offline { background: #555; }
        .chat { flex: 1; display: flex; flex-direction: column; }
        #loading { position: fixed; inset: 0; background: #0b1a2f; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
    </style>
</head>
<body>

<div id="loading">
    <h1>IRN Chat Pro</h1>
    <p>در حال اتصال...</p>
</div>

<!-- صفحه عمومی -->
<div id="publicPage" class="page hidden">
    <div class="header">
        <span>👤 <span id="myName">کاربر</span></span>
        <button onclick="changeName()">تغییر نام</button>
    </div>
    <div id="publicMessages" class="messages"></div>
    <div class="box">
        <input id="publicInput" placeholder="پیام عمومی..." onkeypress="if(event.key==='Enter') sendPublic()">
        <button onclick="sendPublic()">ارسال</button>
    </div>
    <button style="margin-top:10px" onclick="openPrivate()">💬 چت خصوصی</button>
</div>

<!-- صفحه خصوصی -->
<div id="privatePage" class="page hidden">
    <div class="private">
        <div class="users">
            <h3 style="padding:10px; margin:0; font-size:14px;">کاربران</h3>
            <div id="userList"></div>
        </div>
        <div class="chat">
            <div id="privateTitle" class="header">انتخاب کاربر</div>
            <div id="privateMessages" class="messages"></div>
            <div class="box">
                <input id="privateInput" placeholder="پیام خصوصی..." onkeypress="if(event.key==='Enter') sendPrivate()">
                <button onclick="sendPrivate()">ارسال</button>
            </div>
            <button onclick="backPublic()" style="margin-top:10px">⬅ بازگشت</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore-compat.js"></script>

<script>
    // پیکربندی فایربیس
    const firebaseConfig = {
        apiKey: "AIzaSyCzLno3kea6Ab4hXLsj9HZ9SJoTSDIuogk",
        authDomain: "irn-chat-pro.firebaseapp.com",
        projectId: "irn-chat-pro",
        storageBucket: "irn-chat-pro.firebasestorage.app",
        messagingSenderId: "1084279461221",
        appId: "1:1084279461221:web:2fb3ab923e3de7b9e0fd8c"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const messagesRef = db.collection("messages");
    const usersRef = db.collection("users");

    // مدیریت هویت
    let userId = localStorage.getItem("userId") || Math.random().toString(36).substring(2, 12);
    localStorage.setItem("userId", userId);

    let username = localStorage.getItem("chatName") || prompt("نام خود را وارد کنید") || "کاربر";
    localStorage.setItem("chatName", username);

    let selectedUser = null;
    let privateUnsubscribe = null; // برای بستن گوش دادن به پیام‌های خصوصی

    // شروع برنامه
    async function init() {
        document.getElementById("myName").innerText = username;
        
        // ثبت کاربر
        await usersRef.doc(userId).set({
            name: username,
            online: true,
            lastSeen: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        // نمایش صفحه اصلی
        setTimeout(() => {
            document.getElementById("loading").classList.add("hidden");
            document.getElementById("publicPage").classList.remove("hidden");
        }, 1000);

        startListeningPublic();
        startListeningUsers();
    }

    // --- بخش عمومی ---
    function startListeningPublic() {
        messagesRef.orderBy("time", "asc").onSnapshot(snapshot => {
            const box = document.getElementById("publicMessages");
            box.innerHTML = ""; 
            snapshot.forEach(doc => {
                const m = doc.data();
                if (m.type === "public") {
                    box.innerHTML += renderMsg(m, doc.id);
                }
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    function sendPublic() {
        const input = document.getElementById("publicInput");
        const text = input.value.trim();
        if (!text) return;

        messagesRef.add({
            name: username,
            text: text,
            userId: userId,
            type: "public",
            receiverId: null,
            seen: false,
            time: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = "";
    }

    // --- بخش خصوصی ---
    function openPrivate() {
        document.getElementById("publicPage").classList.add("hidden");
        document.getElementById("privatePage").classList.remove("hidden");
    }

    function backPublic() {
        if (privateUnsubscribe) privateUnsubscribe(); // قطع گوش دادن به پیام‌های خصوصی
        document.getElementById("privatePage").classList.add("hidden");
        document.getElementById("publicPage").classList.remove("hidden");
    }

    function startListeningUsers() {
        usersRef.onSnapshot(snapshot => {
            const list = document.getElementById("userList");
            list.innerHTML = "";
            snapshot.forEach(doc => {
                const u = doc.data();
                if (doc.id !== userId) {
                    list.innerHTML += `
                        <div class="user" onclick="selectUser('${doc.id}', '${u.name}')">
                            <span>${u.name}</span>
                            <span class="status-dot ${u.online ? 'online' : 'offline'}"></span>
                        </div>
                    `;
                }
            });
        });
    }

    function selectUser(id, name) {
        selectedUser = { id: id, name: name };
        document.getElementById("privateTitle").innerText = "چت با " + name;
        
        // اگر قبلاً در حال گوش دادن به چت خصوصی بود، اول آن را قطع کن
        if (privateUnsubscribe) privateUnsubscribe();

        // شروع گوش دادن به پیام‌های این کاربر خاص
        privateUnsubscribe = messagesRef.orderBy("time", "asc").onSnapshot(snapshot => {
            const box = document.getElementById("privateMessages");
            box.innerHTML = "";
            
            snapshot.forEach(doc => {
                const m = doc.data();
                // شرط چت خصوصی: یا من فرستادم برای او، یا او برای من فرستاده
                const isFromMe = (m.userId === userId && m.receiverId === selectedUser.id);
                const isToMe = (m.userId === selectedUser.id && m.receiverId === userId);

                if (m.type === "private" && (isFromMe || isToMe)) {
                    // قابلیت خوانده شده
                    if (isToMe && !m.seen) {
                        messagesRef.doc(doc.id).update({ seen: true });
                    }
                    box.innerHTML += renderMsg(m, doc.id);
                }
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    function sendPrivate() {
        if (!selectedUser) return alert("ابتدا کاربر را انتخاب کنید");
        const input = document.getElementById("privateInput");
        const text = input.value.trim();
        if (!text) return;

        messagesRef.add({
            name: username,
            text: text,
            userId: userId,
            receiverId: selectedUser.id,
            type: "private",
            seen: false,
            time: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = "";
    }

    // --- توابع کمکی و سیستمی ---
    function renderMsg(m, docId) {
        const isMine = m.userId === userId;
        const tick = isMine ? (m.seen ? "✔✔" : "✅") : "";
        const del = isMine ? `<button class="delete" onclick="deleteMsg('${docId}')">❌</button>` : "";
        const align = isMine ? "mine" : "";

        return `
            <div class="msg ${align}">
                <div class="name">${m.name}</div>
                <div>${m.text}</div>
                <div class="actions">
                    <span class="tick">${tick}</span>
                    ${del}
                </div>
            </div>
        `;
    }

    // تابع حذف پیام (اصلاح شده)
    window.deleteMsg = function(id) {
        if (confirm("حذف شود؟")) {
            messagesRef.doc(id).delete().catch(err => console.error("خطا در حذف:", err));
        }
    };

    function changeName() {
        let n = prompt("نام جدید:", username);
        if (n && n.trim() !== "") {
            username = n.trim();
            localStorage.setItem("chatName", username);
            document.getElementById("myName").innerText = username;
            usersRef.doc(userId).update({ name: username });
        }
    }

    init();
</script>
</body>
</html>
