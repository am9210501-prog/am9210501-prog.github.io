<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IRN Chat Pro</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');


*{
box-sizing:border-box;
}


body{
margin:0;
height:100vh;
font-family:Vazirmatn,Tahoma;
background:#0b1a2f;
color:white;
overflow:hidden;
}



.hidden{
display:none!important;
}



#loading{

position:fixed;
inset:0;
background:#0b1a2f;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:999;

}



.page{

height:100vh;
display:flex;
flex-direction:column;
padding:10px;

}



.header{

background:#1a3a5a;
padding:10px;
border-radius:10px;
margin-bottom:8px;

}



button{

border:none;
background:#008cff;
color:white;
padding:8px 12px;
border-radius:6px;
cursor:pointer;

}



input{

padding:10px;
border:none;
border-radius:6px;
outline:none;
flex:1;

}



.row{

display:flex;
gap:5px;
margin-top:8px;

}



.messages{

flex:1;
overflow-y:auto;
background:#111;
border-radius:8px;
padding:8px;

}



.msg{

background:#222;
padding:8px;
border-radius:8px;
margin-bottom:6px;

}



.name{

color:#00aaff;
font-size:12px;

}



.status{

font-size:12px;
color:#00ff66;

}



.typing{

height:20px;
font-size:12px;
color:#aaa;

}



/* private */


.privateBox{

display:flex;
flex:1;
gap:8px;

}



.users{

width:220px;
background:#111;
border-radius:8px;
overflow-y:auto;

}



.user{

padding:10px;
border-bottom:1px solid #333;
cursor:pointer;

}



.user:hover{

background:#1a3a5a;

}



.chat{

flex:1;
display:flex;
flex-direction:column;

}



.online{

color:#00ff66;
font-size:11px;

}


.offline{

color:#777;
font-size:11px;

}



.tick{

color:#00ff66;

}



.deleteBtn{

background:#d63031;
font-size:11px;

}



</style>

</head>



<body>



<div id="loading">

<h1>
IRN Chat Pro
</h1>

<p>
سرعت، امنیت، ارتباط
</p>

</div>





<!-- صفحه عمومی -->


<div id="publicPage" class="page hidden">


<div class="header">

👤

<span id="myName">
کاربر
</span>


<button onclick="changeName()">
تغییر نام
</button>


</div>



<div id="typingBox" class="typing">

</div>



<div id="publicMessages" class="messages">

</div>



<div class="row">

<input id="publicInput"
placeholder="پیام عمومی...">


<button onclick="sendPublic()">

ارسال

</button>


</div>



<button onclick="openPrivate()">

💬 چت خصوصی

</button>



</div>









<!-- صفحه خصوصی -->


<div id="privatePage" class="page hidden">


<div class="privateBox">



<div class="users">


<h3 style="padding:10px">

کاربران

</h3>


<div id="userList">

</div>


</div>







<div class="chat">



<div class="header" id="privateTitle">

انتخاب کاربر

</div>



<div id="privateTyping" class="typing">

</div>



<div id="privateMessages" class="messages">

</div>





<div class="row">


<input id="privateInput"
placeholder="پیام خصوصی...">


<button onclick="sendPrivate()">

ارسال

</button>


</div>




<button onclick="backPublic()">

⬅ بازگشت

</button>



</div>


</div>


</div>

<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore-compat.js"></script>


<script>


// ======================
// Firebase
// ======================


const firebaseConfig = {

apiKey: "AIzaSyCzLno3kea6Ab4hXLsj9HZ9SJoTSDIuogk",

authDomain: "irn-chat-pro.firebaseapp.com",

projectId: "irn-chat-pro",

storageBucket: "irn-chat-pro.firebasestorage.app",

messagingSenderId: "1084279461221",

appId: "1:1084279461221:web:2fb3ab923e3de7b9e0fd8c"

};



firebase.initializeApp(firebaseConfig);


const db = firebase.firestore();



const usersRef = db.collection("users");

const messagesRef = db.collection("messages");

const typingRef = db.collection("typing");





// ======================
// ساخت کاربر
// ======================


let userId = localStorage.getItem("userId");



if(!userId){

userId = Math.random()
.toString(36)
.substring(2,12);


localStorage.setItem(
"userId",
userId
);

}





let username = localStorage.getItem("chatName");



if(!username){

username = prompt("نام خود را وارد کنید") || "کاربر ناشناس";


localStorage.setItem(
"chatName",
username
);

}





document.getElementById("myName")
.innerText=username;







// ثبت آنلاین بودن


usersRef.doc(userId).set({

name:username,

online:true,

lastSeen:
firebase.firestore.FieldValue.serverTimestamp()


},
{
merge:true
});






// وقتی صفحه بسته شد


window.addEventListener(
"beforeunload",
()=>{


usersRef.doc(userId).update({

online:false,

lastSeen:
firebase.firestore.FieldValue.serverTimestamp()


});


});







// نمایش صفحه


setTimeout(()=>{


document
.getElementById("loading")
.classList.add("hidden");



document
.getElementById("publicPage")
.classList.remove("hidden");



},1000);







// تغییر نام


function changeName(){


let newName =
prompt("نام جدید:");



if(newName){


username=newName;



localStorage.setItem(
"chatName",
username
);



document.getElementById("myName")
.innerText=username;



usersRef.doc(userId)
.update({

name:username

});



}


}







// نمایش کاربران آنلاین


usersRef.onSnapshot(snapshot=>{


const list =
document.getElementById("userList");



list.innerHTML="";



snapshot.forEach(doc=>{


if(doc.id!==userId){



let u=doc.data();



let status =
u.online
?
"🟢 آنلاین"
:
"⚪ آفلاین";



list.innerHTML += `


<div class="user">


${u.name}

<br>

<span class="${u.online?'online':'offline'}">

${status}

</span>


</div>


`;



}



});



});





  </script>


</body>

</html>
