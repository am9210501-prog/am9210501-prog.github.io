<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRN Chat Pro - Optimized</title>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-firestore-compat.js"></script>
    <style>
        /* CSS کوتاه و مدرن */
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --accent: #007bff; }
        body { font-family: Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; }
        #sidebar { width: 250px; background: var(--card); border-left: 1px solid #333; padding: 15px; }
        #chat-area { flex: 1; display: flex; flex-direction: column; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #2c2c2c; padding: 10px; border-radius: 8px; max-width: 70%; position: relative; }
        .msg.mine { align-self: flex-start; background: var(--accent); }
        .msg .info { font-size: 0.7rem; opacity: 0.7; margin-bottom: 5px; }
        .msg .actions { position: absolute; top: 5px; left: 5px; display: none; }
        .msg:hover .actions { display: block; }
        #input-area { padding: 20px; background: var(--card); display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: none; background: #333; color: white; }
        button { padding: 10px 20px; background: var(--accent); border: none; color: white; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3>لیست کاربران</h3>
    <div id="user-list">در حال بارگذاری...</div>
</div>

<div id="chat-area">
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="msgInput" placeholder="پیام خود را بنویسید...">
        <button onclick="ui.handleSend()">ارسال</button>
    </div>
</div>

<script>
    // --- ۱. پیکربندی فایربیس (حتماً اطلاعات خود را اینجا بگذارید) ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);

    // داده‌های فرضی کاربر (در حالت واقعی از localStorage می‌آید)
    const currentUser = {
        id: localStorage.getItem("userId") || "user_" + Math.random().toString(36).substr(2, 9),
        name: localStorage.getItem("chatName") || "کاربر مهمان"
    };
    if(!localStorage.getItem("userId")) {
        localStorage.setItem("userId", currentUser.id);
        localStorage.setItem("chatName", currentUser.name);
    }

    // --- ۲. لایه دیتابیس (ChatDB Service) ---
    const dbService = {
        collection: firebase.firestore().collection("messages"),
        
        sendMessage: async (text, receiverId = null) => {
            return await dbService.collection.add({
                text,
                receiverId,
                senderId: currentUser.id,
                senderName: currentUser.name,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                seen: false
            });
        },

        subscribeMessages: (callback) => {
            return dbService.collection.orderBy("timestamp", "asc").onSnapshot(snap => {
                const msgs = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                callback(msgs);
            });
        },

        deleteMsg: (id) => dbService.collection.doc(id).delete(),

        markAsRead: (id) => dbService.collection.doc(id).update({ seen: true })
    };

    // --- ۳. لایه رابط کاربری (UI Controller) ---
    const ui = {
        elements: {
            msgBox: document.getElementById("messages"),
            input: document.getElementById("msgInput")
        },

        init() {
            // شروع گوش دادن به پیام‌ها
            dbService.subscribeMessages(msgs => this.renderMessages(msgs));
        },

        renderMessages(msgs) {
            this.elements.msgBox.innerHTML = msgs.map(m => `
                <div class="msg ${m.senderId === currentUser.id ? 'mine' : ''}">
                    <div class="info">${m.senderName} • ${m.timestamp ? new Date(m.timestamp.toDate()).toLocaleTimeString('fa-IR') : ''}</div>
                    <div>${m.text}</div>
                    <div class="actions">
                        ${m.senderId === currentUser.id ? `<button onclick="ui.handleDelete('${m.id}')">🗑️</button>` : ""}
                    </div>
                </div>
            `).join('');
            // اسکرول به پایین
            this.elements.msgBox.scrollTop = this.elements.msgBox.scrollHeight;
        },

        handleSend() {
            const text = this.elements.input.value.trim();
            if (text) {
                dbService.sendMessage(text);
                this.elements.input.value = "";
            }
        },

        handleDelete(id) {
            if(confirm("آیا از حذف پیام مطمئن هستید؟")) {
                dbService.deleteMsg(id);
            }
        }
    };

    // اجرای برنامه
    ui.init();

    // ارسال با اینتر
    document.getElementById("msgInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") ui.handleSend();
    });

</script>
</body>
</html>
