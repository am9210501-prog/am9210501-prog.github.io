<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRN Chat Pro - با حذف و ریپلای</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
body, html{margin:0;padding:0;font-family:'Vazirmatn',tahoma;background:#0b1a2f;color:white;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
#loadingScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0b1a2f;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;}
#loadingScreen h1{font-size:32px;margin:10px;text-align:center;}
#loadingScreen p{font-size:18px;color:#aaa;margin-top:5px;text-align:center;}
#publicView,#privateView{flex:1;display:flex;flex-direction:column;padding:10px;overflow:hidden;}
.messages{flex:1;overflow-y:auto;padding:5px;border-radius:6px;background:#111;margin-bottom:5px;}
.msg{background:#222;margin:5px;padding:5px;border-radius:6px;position:relative;animation:fade .3s;display:flex;justify-content:space-between;align-items:center;}
.msg .reactions span{cursor:pointer;margin-left:5px;}
.msg .reply-box{background:#333;padding:3px;font-size:12px;color:#fff3cd;margin-bottom:3px;border-radius:3px;}
.chat-input{display:flex;}
.chat-input input{flex:1;padding:10px;border-radius:6px;border:none;margin-right:5px;}
.chat-input button{padding:10px;border:none;border-radius:6px;background:#00aaff;color:white;cursor:pointer;}
#privateBtn,#backBtn{padding:15px;margin:5px;border:none;border-radius:8px;background:#0d6efd;color:white;font-size:16px;cursor:pointer;}
.sidebar{width:250px;background:#111;border-right:1px solid #444;display:flex;flex-direction:column;overflow-y:auto;}
.sidebar h3{margin:5px;padding:5px;border-bottom:1px solid #444;}
.sidebar .userItem{padding:5px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.sidebar .userItem:hover{background:#0d6efd;}
.online-dot{width:10px;height:10px;border-radius:50%;background:#0f0;display:inline-block;margin-left:5px;}
.unread-count{background:red;color:white;border-radius:50%;padding:2px 6px;margin-left:5px;font-size:12px;}
.privateChatWindow{flex:1;display:flex;flex-direction:column;}
.ticks{margin-left:5px;font-size:12px;color:#0f0;}
.sent{color:#aaa;}
.seen{color:#0f0;}
.msg button{margin-left:5px;background:#555;color:white;border:none;border-radius:3px;cursor:pointer;padding:2px 5px;font-size:12px;}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1}}

/* FINAL MOBILE + NOTICE FIX */
html,body{width:100%;height:100%;overflow:hidden}
body{min-height:100dvh}
.page{height:100dvh;min-height:0}
.messages{min-height:0;overscroll-behavior:contain}
.private,.chat{min-height:0}
.private{height:100%}
.chat{height:100%;min-width:0;overflow:hidden}
.chat .messages{min-height:0}
.box{flex:0 0 auto}
.notice-box{
  flex:0 0 auto;margin:8px 0 0;padding:10px 12px;border-radius:10px;
  background:linear-gradient(135deg,#173b5b,#24577e);
  border:1px solid rgba(255,255,255,.12);color:#fff;font-size:13px;line-height:1.9
}
.notice-box strong{display:block;font-size:14px;margin-bottom:2px}
@media(max-width:700px){
  .page{padding:6px}.private{gap:6px}
  .users{width:112px;flex:0 0 112px}
  .user{padding:9px 7px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat .header{padding:8px;margin-bottom:5px;font-size:13px}
  .messages{padding:6px}.msg{padding:8px;font-size:13px}
  .box{gap:5px;margin-top:6px}
  .box input{min-width:0;height:42px;font-size:14px}
  .box button{height:42px;padding:7px 10px;flex:0 0 auto}
  #privatePage .chat>button{flex:0 0 auto;height:38px;margin-top:5px}
  .notice-box{padding:8px 10px;font-size:12px}
}


.extra-btn{padding:7px 9px;border:0;border-radius:7px;background:#183c5d;color:#fff;cursor:pointer}.notice-box{flex:0 0 auto;margin:7px 0;padding:9px 11px;border-radius:10px;background:linear-gradient(135deg,#173b5b,#24577e);border:1px solid rgba(255,255,255,.12);font-size:12px;line-height:1.8}.notice-box strong{display:block;font-size:14px}.reaction-active{outline:1px solid #00aaff;background:#12405a!important}
@media(max-width:700px){#extraPanel{padding:10px}.notice-box{font-size:11px}.notice-box strong{font-size:13px}}

/* FINAL CHAT SCROLL FIX */
#publicView,#privateView{min-height:0}
#privateView{height:100dvh;min-height:0}
.privateChatWindow{min-height:0;overflow:hidden}
#privateChatContainer{min-height:0;height:100%}
#messagesPublic,#privateMessages{min-height:0;overflow-y:auto;overscroll-behavior:contain}
.chat-input{flex:0 0 auto;min-height:52px;align-items:center}
.chat-input input{min-width:0}
@media(max-width:700px){
  #privateView{flex-direction:column!important}
  .sidebar{width:100%;height:auto;max-height:150px;flex:0 0 auto;border-right:0;border-bottom:1px solid #444}
  .privateChatWindow{width:100%;flex:1;min-height:0}
  #privateChatContainer{height:100%;min-height:0}
  .chat-input{padding-bottom:max(4px,env(safe-area-inset-bottom))}
}

</style>
</head>
<body>

<div id="loadingScreen">
  <h1>پیام‌رسانی ساده برای همه</h1>
  <p>«سرعت، امنیت، ارتباط»</p>
</div>

<div id="publicView" style="display:none;">
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;direction:rtl">👤 <strong id="displayName"></strong> <button onclick="changeName()">تغییر نام</button><button onclick="openPanel('notice')">📢 اطلاعیه</button><button onclick="openPanel('settings')">⚙️ تنظیمات</button><button onclick="openPanel('rules')">📜 قوانین</button></div>
  <div id="typingStatus" style="font-size:12px;color:#aaa;"></div><div class="notice-box"><strong>📢 اطلاعیه</strong><span>به IRN Chat Pro خوش آمدید؛ برای یک تجربه بهتر، احترام به دیگر کاربران را رعایت کنید.</span></div>
  <div class="messages" id="messagesPublic"></div>
  <div class="chat-input">
    <input id="text" placeholder="پیام عمومی...">
    <button onclick="sendPublicMessage()">ارسال</button>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px">
<button onclick='openExtraPage("notice")'>📢 اطلاعیه</button>
<button onclick='openExtraPage("rules")'>📜 قوانین</button>
<button onclick='openExtraPage("settings")'>⚙️ تنظیمات</button>
</div>
<button id="privateBtn">💬 چت خصوصی <span id="unreadPrivateCount" class="unread-count" style="display:none">0</span></button>
</div>

<div id="extraPanel" style="display:none;position:fixed;inset:0;background:#0b1a2f;z-index:5000;padding:14px;overflow:auto;direction:rtl"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="panelTitle" style="margin:0"></h2><button onclick="closePanel()">✕ بستن</button></div><div id="panelBody" style="margin-top:14px;line-height:2"></div></div>
<div id="privateView" style="display:none;flex:1;flex-direction:row;">
  <div class="sidebar">
    <h3>چت خصوصی</h3>
    <input id="privateSearch" placeholder="جستجو کاربران" style="margin:5px;padding:5px;border-radius:5px;border:none;">
    <div id="privateUserList"></div>
    <button id="backBtn">بازگشت به عمومی</button>
  </div>
  <div class="privateChatWindow">
    <div id="privateChatContainer" style="flex:1;display:flex;flex-direction:column;">
      <div class="messages" id="privateMessages"></div>
      <div class="chat-input">
        <input id="privateText" placeholder="پیام خصوصی...">
        <button onclick="sendPrivateMessage()">ارسال</button>
      </div>
    </div>
  </div>
</div>

<audio id="notifSound" src="https://actions.google.com/sounds/v1/alarms/notification_simple-02.mp3"></audio>

<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={
  apiKey:"AIzaSyCzLno3kea6Ab4hXLsj9HZ9SJoTSDIuogk",
  authDomain:"irn-chat-pro.firebaseapp.com",
  projectId:"irn-chat-pro",
  storageBucket:"irn-chat-pro.firebasestorage.app",
  messagingSenderId:"1084279461221",
  appId:"1:1084279461221:web:2fb3ab923e3de7b9e0fd8c"
};

let db,messagesRef,usersRef,typingRef;
let userId=localStorage.getItem("userId")||crypto.randomUUID(); localStorage.setItem("userId",userId);
let username=localStorage.getItem("chatName")||"";
let selectedPrivateUser=null;
let usersCache=[];
let publicUnsub=null,privateUnsub=null,typingUnsub=null,usersUnsub=null,unreadUnsub=null,heartbeat=null;

function $(id){return document.getElementById(id)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function serverTime(){return firebase.firestore.FieldValue.serverTimestamp()}
function normalize(n){return String(n||"").trim().replace(/\s+/g," ").toLowerCase()}
function validName(n){return n.length>=3&&n.length<=30&&!/[<>]/.test(n)}
async function changeName(){
  let n=prompt("نام کاربری جدید را وارد کنید",username||"");
  if(n===null)return;
  n=n.trim();
  if(!validName(n)){alert("نام کاربری باید بین ۳ تا ۳۰ کاراکتر باشد.");return;}
  if(normalize(n)===normalize(username))return;
  try{
    const snap=await usersRef.where("name","==",n).limit(10).get();
    if(snap.docs.some(d=>d.id!==userId)){alert("این نام کاربری قبلاً گرفته شده است.");return;}
    username=n;
    localStorage.setItem("chatName",username);
    await usersRef.doc(userId).set({userId,name:username,online:true,lastSeen:serverTime(),updatedAt:serverTime()},{merge:true});
    $("displayName").textContent=username;
  }catch(e){console.error(e);alert("تغییر نام انجام نشد.");}
}


function showApp(){
  $("displayName").textContent=username;
  $("loadingScreen").style.display="none";
  $("publicView").style.display="flex";
}

function showError(text){
  const p=$("loadingScreen").querySelector("p");
  if(p){p.textContent=text;p.style.color="#ffb4b4"}
}

async function setupUsername(){
  let n=username;
  while(true){
    n=prompt("نام کاربری خود را وارد کنید",n||"");
    if(n===null){showError("برای ورود، یک نام کاربری وارد کن.");return false}
    n=n.trim();
    if(!validName(n)){alert("نام کاربری باید بین ۳ تا ۳۰ کاراکتر باشد.");continue}

    try{
      // IMPORTANT: use the same "name" field that the current Firebase Rules allow.
      const snap=await usersRef.where("name","==",n).limit(10).get();
      const duplicate=snap.docs.some(d=>d.id!==userId);
      if(duplicate){alert("این نام کاربری قبلاً گرفته شده است.");continue}

      username=n;
      localStorage.setItem("chatName",username);
      await usersRef.doc(userId).set({
        userId:userId,
        name:username,
        online:true,
        lastSeen:serverTime(),
        updatedAt:serverTime()
      },{merge:true});

      return true;
    }catch(e){
      console.error(e);
      showError("خطا در اتصال به Firebase. صفحه را نبند؛ Rules دیتابیس را بررسی کن.");
      return false;
    }
  }
}

function setOnline(){
  usersRef.doc(userId).set({
    userId,name:username,online:true,lastSeen:serverTime(),updatedAt:serverTime()
  },{merge:true}).catch(console.error);
  clearInterval(heartbeat);
  heartbeat=setInterval(()=>usersRef.doc(userId).set({
    online:true,lastSeen:serverTime()
  },{merge:true}).catch(()=>{}),20000);
}

function isOnline(u){
  const t=u.lastSeen?.toMillis?.()||0;
  return !!u.online && t>0 && Date.now()-t<45000;
}

function renderUsers(){
  const list=$("privateUserList");
  if(!list)return;
  const q=($("privateSearch").value||"").trim().toLowerCase();
  list.innerHTML="";
  usersCache.filter(u=>(u.name||"").toLowerCase().includes(q)).forEach(u=>{
    const d=document.createElement("div");
    d.className="userItem";
    d.innerHTML=`<span>${esc(u.name)}</span><span>${isOnline(u)?"<span class='online-dot'></span>":"<span style='color:#888;font-size:11px'>آفلاین</span>"}</span>`;
    d.onclick=()=>selectPrivateUser(u.id,u.name);
    list.appendChild(d);
  });
}

function listenUsers(){
  usersUnsub=usersRef.onSnapshot(s=>{
    usersCache=[];
    s.forEach(d=>{if(d.id!==userId)usersCache.push({id:d.id,...d.data()})});
    renderUsers();
  },e=>console.error("users:",e));
}

function formatTime(t){
  return t?.toDate?.().toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"})||"";
}

function renderMessage(m,id,privateRoom){
  const mine=m.userId===userId;
  const tick=mine?(m.seen?"<span class='ticks seen'>✔✔</span>":"<span class='ticks sent'>✓</span>"):"";
  const reply=m.replyTo?`<div class="reply-box">↩ ${esc(m.replyTo.text)}</div>`:"";
  const react=m.reactions||{};
  return `<div class="msg" data-id="${id}">
    <div style="flex:1">
      <b>${esc(m.name)}</b>
      <small style="opacity:.6;margin-right:5px">${formatTime(m.time)}</small>
      ${reply}
      <div>${esc(m.text)}${m.edited?" <small>(ویرایش‌شده)</small>":""}</div>
      <div class="reactions">
        <span class="${(react.reactedBy&&react.reactedBy[userId]&&react.reactedBy[userId].like)?"reaction-active":""}" data-react="${id}" data-r="like">👍 ${react.like||0}</span>
        <span class="${(react.reactedBy&&react.reactedBy[userId]&&react.reactedBy[userId].heart)?"reaction-active":""}" data-react="${id}" data-r="heart">❤️ ${react.heart||0}</span>
        <span class="${(react.reactedBy&&react.reactedBy[userId]&&react.reactedBy[userId].laugh)?"reaction-active":""}" data-react="${id}" data-r="laugh">😂 ${react.laugh||0}</span>
        <span class="${(react.reactedBy&&react.reactedBy[userId]&&react.reactedBy[userId].fire)?"reaction-active":""}" data-react="${id}" data-r="fire">🔥 ${react.fire||0}</span>
      </div>
    </div>
    ${tick}
    ${mine?`<button onclick="editMessage('${id}')">✏️</button><button onclick="deleteMsg('${id}')">❌</button>`:""}
    <button onclick="replyToMessage('${id}',${privateRoom?'true':'false'})">↩️</button>
  </div>`;
}

function renderPublic(snap){
  const box=$("messagesPublic");
  box.innerHTML="";
  const docs=snap.docs.filter(d=>{
    const m=d.data();
    return !m.receiverId;
  }).sort((a,b)=>(a.data().time?.toMillis?.()||0)-(b.data().time?.toMillis?.()||0));
  docs.forEach(d=>box.insertAdjacentHTML("beforeend",renderMessage(d.data(),d.id,false)));
  box.scrollTop=box.scrollHeight;
}

function listenPublic(){
  publicUnsub=messagesRef.onSnapshot(renderPublic,e=>console.error("public:",e));
}

function selectPrivateUser(id,name){
  selectedPrivateUser={id,name};
  loadPrivateMessages();
  markMessagesAsReadFrom(id);
}

function loadPrivateMessages(){
  if(privateUnsub)privateUnsub();
  if(!selectedPrivateUser)return;
  privateUnsub=messagesRef.onSnapshot(snap=>{
    const box=$("privateMessages");
    box.innerHTML="";
    const docs=snap.docs.filter(d=>{
      const m=d.data();
      return m.receiverId &&
       ((m.userId===userId&&m.receiverId===selectedPrivateUser.id)||
        (m.userId===selectedPrivateUser.id&&m.receiverId===userId));
    }).sort((a,b)=>(a.data().time?.toMillis?.()||0)-(b.data().time?.toMillis?.()||0));
    if(!docs.length)box.innerHTML="<div style='opacity:.5;text-align:center;padding:20px'>هنوز پیامی نیست.</div>";
    docs.forEach(d=>box.insertAdjacentHTML("beforeend",renderMessage(d.data(),d.id,true)));
    box.scrollTop=box.scrollHeight;
  },e=>console.error("private:",e));
}

async function markMessagesAsReadFrom(senderId){
  try{
    const snap=await messagesRef.where("receiverId","==",userId).get();
    const batch=db.batch();
    let n=0;
    snap.forEach(d=>{
      const m=d.data();
      if(m.userId===senderId&&!m.seen){batch.update(d.ref,{seen:true});n++}
    });
    if(n)await batch.commit();
  }catch(e){console.error(e)}
}

function updateUnread(){
  if(unreadUnsub)unreadUnsub();
  unreadUnsub=messagesRef.onSnapshot(s=>{
    let count=0;
    s.forEach(d=>{const m=d.data();if(m.receiverId===userId&&!m.seen)count++});
    const el=$("unreadPrivateCount");
    if(el){el.style.display=count?"inline-block":"none";el.textContent=count}
  });
}


async function deleteAccount(){
  if(!confirm("حساب کاربری حذف شود؟"))return;
  if(!confirm("تأیید نهایی: این کار قابل برگشت نیست."))return;
  try{
    await usersRef.doc(userId).delete();
    localStorage.removeItem("chatName");
    localStorage.removeItem("userId");
    alert("حساب حذف شد.");
    location.reload();
  }catch(e){console.error(e);alert("حذف حساب انجام نشد؛ Rule حذف users را بررسی کنید.")}
}

async function sendPublicMessage(){
  const input=$("text"),text=input.value.trim();
  if(!text)return;
  try{
    await messagesRef.add({
      type:"public",name:username,userId,uid:userId,
      receiverId:null,text,replyTo:null,reactions:{},
      time:serverTime(),seen:false
    });
    input.value="";
  }catch(e){console.error(e);alert("ارسال پیام انجام نشد. Rules Firebase را بررسی کن.")}
}

async function sendPrivateMessage(){
  if(!selectedPrivateUser){alert("اول یک کاربر را از بخش چت خصوصی انتخاب کن.");return}
  const input=$("privateText"),text=input.value.trim();
  if(!text)return;
  try{
    await messagesRef.add({
      type:"private",name:username,userId,uid:userId,
      receiverId:selectedPrivateUser.id,text,replyTo:null,reactions:{},
      time:serverTime(),seen:false
    });
    input.value="";
  }catch(e){console.error(e);alert("ارسال پیام خصوصی انجام نشد.")}
}

async function deleteMsg(id){
  try{await messagesRef.doc(id).delete()}catch(e){alert("حذف پیام انجام نشد؛ اجازه Delete در Rules لازم است.")}
}

async function editMessage(id){
  const snap=await messagesRef.doc(id).get();
  if(!snap.exists)return;
  const m=snap.data();
  if(m.userId!==userId)return;
  const n=prompt("متن جدید پیام:",m.text);
  if(n&&n.trim()&&n.trim()!==m.text){
    await messagesRef.doc(id).update({text:n.trim(),edited:true,editedAt:serverTime()});
  }
}

async function replyToMessage(id,isPrivate){
  const m=(await messagesRef.doc(id).get()).data();
  if(!m)return;
  const input=isPrivate?$("privateText"):$("text");
  input.value="↩ "+m.text+" ";
  input.focus();
}

document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-react]");
  if(!el)return;
  const id=el.dataset.react,field=el.dataset.r,ref=messagesRef.doc(id);
  try{
    await db.runTransaction(async tx=>{
      const snap=await tx.get(ref); if(!snap.exists)return;
      const m=snap.data(),r=m.reactions||{},by=r.reactedBy||{};
      const previous=by[userId]?.field||null;
      if(previous===field)return;
      const updates={};
      if(previous)updates["reactions."+previous]=firebase.firestore.FieldValue.increment(-1);
      updates["reactions."+field]=firebase.firestore.FieldValue.increment(1);
      updates["reactions.reactedBy."+userId]={field};
      tx.update(ref,updates);
    });
  }catch(err){console.error("REACTION:",err)}
});

function startTyping(){
  $("text").addEventListener("input",()=>{
    typingRef.doc(userId).set({name:username,active:true,room:"public",expiresAt:Date.now()+1800},{merge:true}).catch(()=>{});
    clearTimeout(window.__pubTyping);
    window.__pubTyping=setTimeout(()=>typingRef.doc(userId).delete().catch(()=>{}),1800);
  });
  $("privateText").addEventListener("input",()=>{
    if(!selectedPrivateUser)return;
    const id="private_"+userId+"_"+selectedPrivateUser.id;
    typingRef.doc(id).set({name:username,userId,receiverId:selectedPrivateUser.id,active:true,room:"private",expiresAt:Date.now()+1800},{merge:true}).catch(()=>{});
    clearTimeout(window.__privTyping);
    window.__privTyping=setTimeout(()=>typingRef.doc(id).delete().catch(()=>{}),1800);
  });
  typingUnsub=typingRef.onSnapshot(s=>{
    let pub=[],priv=[];
    s.forEach(d=>{
      const m=d.data();
      if(d.id===userId||!m.active||m.expiresAt<Date.now())return;
      if(m.room==="public")pub.push(m.name);
      if(m.room==="private"&&selectedPrivateUser&&m.userId===selectedPrivateUser.id)priv.push(m.name);
    });
    $("typingStatus").textContent=pub.length?pub.join(" و ")+" در حال نوشتن...":"";
  });
}


function openPanel(type){
 const p=$("extraPanel"),t=$("panelTitle"),b=$("panelBody"); p.style.display="block";
 if(type==="notice"){t.textContent="📢 اطلاعیه";b.innerHTML="<div class='notice-box'><strong>اطلاعیه پیام‌رسان</strong>به IRN Chat Pro خوش آمدید. قابلیت‌های جدید به‌مرور اضافه می‌شوند.</div>"}
 if(type==="settings"){t.textContent="⚙️ تنظیمات";b.innerHTML="<button onclick="changeName()">تغییر نام کاربری</button><p>نام کاربری فعلی: <b>"+esc(username)+"</b></p><p>اعلان‌ها از تنظیمات مرورگر قابل فعال‌سازی هستند.</p>"}

function closePanel(){$("extraPanel").style.display="none"}

async function boot(){
  try{
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    db=firebase.firestore();
    messagesRef=db.collection("messages");
    usersRef=db.collection("users");
    typingRef=db.collection("typing");

    // If a saved name exists, verify it; otherwise ask for a name.
    if(!username){
      const ok=await setupUsername();
      if(!ok)return;
    }else{
      await usersRef.doc(userId).set({userId,name:username,online:true,lastSeen:serverTime(),updatedAt:serverTime()},{merge:true});
    }

    showApp();
    setOnline();
    listenPublic();
    listenUsers();
    updateUnread();
    startTyping();

    $("privateBtn").onclick=()=>{
      $("publicView").style.display="none";
      $("privateView").style.display="flex";
      renderUsers();
    };
    $("backBtn").onclick=()=>{
      $("privateView").style.display="none";
      $("publicView").style.display="flex";
    };
    $("privateSearch").oninput=renderUsers;
    $("text").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendPublicMessage()}});
    $("privateText").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendPrivateMessage()}});
    $("text").addEventListener("focus",()=>{});
  }catch(e){
    console.error("BOOT ERROR:",e);
    showError("اتصال به Firebase برقرار نشد. کنسول مرورگر را بررسی کن.");
  }
}

window.addEventListener("online",()=>{});
window.addEventListener("offline",()=>{});
window.addEventListener("beforeunload",()=>{if(usersRef)usersRef.doc(userId).set({online:false,lastSeen:serverTime()},{merge:true}).catch(()=>{})});

boot();
</script>
