<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IRN Chat Pro</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
height:100vh;
font-family:tahoma;
background:#0b1a2f;
color:white;

}


.page{

height:100vh;
display:flex;
flex-direction:column;
padding:10px;

}


.header{

background:#17395b;
padding:12px;
border-radius:10px;

display:flex;
justify-content:space-between;
align-items:center;

}


.logo{

font-size:22px;
font-weight:bold;

}


button{

background:#008cff;
color:white;

border:0;

padding:10px 15px;

border-radius:7px;

}


.messages{

flex:1;

background:#111;

margin-top:10px;

border-radius:10px;

padding:10px;

overflow:auto;

}


.bottom{

display:flex;

gap:8px;

margin-top:10px;

}


input{

flex:1;

padding:12px;

border-radius:7px;

border:0;

}


</style>


</head>



<body>



<div class="page">


<div class="header">


<div class="logo">

IRN Chat Pro

</div>


<div>

کاربر

<button>

تغییر نام

</button>

</div>


</div>



<div class="messages">


</div>



<div class="bottom">


<input placeholder="پیام بنویس...">


<button>

ارسال

</button>


</div>


</div>

<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore-compat.js"></script>
<script>


const firebaseConfig = {

apiKey: "AIzaSyCzLno3kea6Ab4hXLsj9HZ9SJoTSDIuogk",

authDomain: "irn-chat-pro.firebaseapp.com",

projectId: "irn-chat-pro",

storageBucket: "irn-chat-pro.firebasestorage.app",

messagingSenderId: "1084279461221",

appId: "1:1084279461221:web:2fb3ab923e3de7b9e0fd8c"

};



firebase.initializeApp(firebaseConfig);



const db = firebase.firestore();

// =====================
// USER SYSTEM
// =====================


let userId = localStorage.getItem("userId");


if(!userId){

userId =
Math.random()
.toString(36)
.substring(2,12);


localStorage.setItem(
"userId",
userId
);

}




let username =
localStorage.getItem("chatName");



if(!username){


username =
prompt("اسم خود را وارد کنید")
||
"کاربر";


localStorage.setItem(
"chatName",
username
);


}




// نمایش اسم

document.querySelector(".userInfo")
.firstChild.textContent =
username + " ";



// ذخیره در Firebase

db.collection("users")
.doc(userId)
.set({

name:username,

online:true,

lastSeen:
firebase.firestore.FieldValue.serverTimestamp()


},
{

merge:true

});



console.log(
"User Created:",
username
);

console.log("Firebase Connected");


</script>
</body>


</html>
