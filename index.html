<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IRN Chat Pro</title>

<style>

body{
    margin:0;
    background:#0b1a2f;
    color:white;
    font-family:tahoma;
}

.box{
    padding:15px;
}

#messages{
    height:70vh;
    overflow:auto;
    background:#111;
    border-radius:10px;
    padding:10px;
}

.msg{
    background:#222;
    padding:8px;
    margin:5px;
    border-radius:8px;
}

.name{
    color:#00aaff;
    font-size:12px;
}

input{
    width:75%;
    padding:12px;
    border-radius:8px;
    border:0;
}

button{
    padding:12px;
    background:#008cff;
    color:white;
    border:0;
    border-radius:8px;
}

</style>

</head>


<body>


<div class="box">


<h2>
💬 IRN Chat Pro
</h2>


<div>
👤
<span id="myName"></span>
</div>


<br>


<div id="messages"></div>


<br>


<input id="text" placeholder="پیام...">

<button onclick="send()">
ارسال
</button>


</div>





<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore-compat.js"></script>



<script>


// Firebase

const firebaseConfig = {

  apiKey: "AIzaSyCzLno3kea6Ab4hXLsj9HZ9SJoTSDIuogk",

  authDomain: "irn-chat-pro.firebaseapp.com",

  projectId: "irn-chat-pro",

  storageBucket: "irn-chat-pro.firebasestorage.app",

  messagingSenderId: "1084279461221",

  appId: "1:1084279461221:web:2fb3ab923e3de7b9e0fd8c"

};


firebase.initializeApp(firebaseConfig);


const db=firebase.firestore();


const messages=db.collection("messages");

const users=db.collection("users");



// کاربر


let userId=localStorage.getItem("uid");


if(!userId){

userId=Math.random().toString(36).substring(2);

localStorage.setItem("uid",userId);

}



let name=localStorage.getItem("name");


if(!name){

name=prompt("نام شما؟") || "کاربر";

localStorage.setItem("name",name);

}


document.getElementById("myName").innerText=name;



users.doc(userId).set({

name:name,

online:true

},{merge:true});





// ارسال پیام


function send(){


let input=document.getElementById("text");


let txt=input.value.trim();


if(!txt)return;



messages.add({

name:name,

text:txt,

userId:userId,

type:"public",

time:firebase.firestore.FieldValue.serverTimestamp()

});


input.value="";


}






// دریافت پیام


messages.orderBy("time","asc")
.onSnapshot(s=>{


let box=document.getElementById("messages");


box.innerHTML="";


s.forEach(d=>{


let m=d.data();


if(m.type==="public"){


box.innerHTML += `

<div class="msg">

<div class="name">
${m.name}
</div>

${m.text}

</div>

`;

}


});


box.scrollTop=box.scrollHeight;


});



</script>


</body>

    </html>
