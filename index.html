<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IRN Chat Pro</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');


*{
box-sizing:border-box;
}


body{

margin:0;
height:100vh;
font-family:Vazirmatn,Tahoma;
background:#0b1a2f;
color:white;

}


.hidden{

display:none!important;

}


.page{

height:100vh;
display:flex;
flex-direction:column;
padding:10px;

}


.header{

background:#1a3a5a;
padding:10px;
border-radius:8px;
margin-bottom:8px;

}



button{

background:#008cff;
color:white;
border:none;
padding:8px 12px;
border-radius:6px;
cursor:pointer;

}



input{

padding:10px;
border-radius:6px;
border:none;
outline:none;
flex:1;

}



.box{

display:flex;
gap:5px;
margin-top:8px;

}



.messages{

flex:1;
background:#111;
border-radius:8px;
padding:8px;
overflow-y:auto;

}



.msg{

background:#222;
padding:8px;
border-radius:7px;
margin-bottom:5px;

}



.name{

color:#00aaff;
font-size:12px;

}



.actions{

margin-top:5px;
font-size:12px;

}



.tick{

color:#00ff00;

}



.delete{

background:#c0392b;
padding:4px 8px;
font-size:11px;

}



/* خصوصی */


.private{

display:flex;
flex:1;
gap:8px;

}



.users{

width:220px;
background:#111;
border-radius:8px;
overflow-y:auto;

}



.user{

padding:10px;
border-bottom:1px solid #333;
cursor:pointer;

}



.user:hover{

background:#1a3a5a;

}



.chat{

flex:1;
display:flex;
flex-direction:column;

}




#loading{

position:fixed;
inset:0;
background:#0b1a2f;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:99;

}



</style>

</head>


<body>



<div id="loading">

<h1>
IRN Chat Pro
</h1>

<p>
سرعت، امنیت، ارتباط
</p>

</div>





<!-- عمومی -->


<div id="publicPage" class="page hidden">


<div class="header">

👤

<span id="myName">
کاربر
</span>


<button onclick="changeName()">
تغییر نام
</button>


</div>



<div id="publicMessages" class="messages">

</div>



<div class="box">


<input id="publicInput" placeholder="پیام عمومی...">


<button onclick="sendPublic()">

ارسال

</button>


</div>



<button onclick="openPrivate()">

💬 چت خصوصی

</button>


</div>







<!-- خصوصی -->


<div id="privatePage" class="page hidden">


<div class="private">


<div class="users">


<h3 style="padding:10px">

کاربران

</h3>


<div id="userList">

</div>


</div>





<div class="chat">


<div id="privateTitle" class="header">

انتخاب کاربر

</div>



<div id="privateMessages" class="messages">

</div>




<div class="box">


<input id="privateInput" placeholder="پیام خصوصی...">


<button onclick="sendPrivate()">

ارسال

</button>


</div>



<button onclick="backPublic()">

⬅ بازگشت

</button>



</div>


</div>


</div>
<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore-compat.js"></script>


<script>


const firebaseConfig = {

apiKey: "AIzaSyCzLno3kea6Ab4hXLsj9HZ9SJoTSDIuogk",

authDomain: "irn-chat-pro.firebaseapp.com",

projectId: "irn-chat-pro",

storageBucket: "irn-chat-pro.firebasestorage.app",

messagingSenderId: "1084279461221",

appId: "1:1084279461221:web:2fb3ab923e3de7b9e0fd8c"

};



firebase.initializeApp(firebaseConfig);


const db = firebase.firestore();


const messagesRef = db.collection("messages");

const usersRef = db.collection("users");





// کاربر
// ======================
// USER SYSTEM
// ======================


let userId = localStorage.getItem("userId");


if(!userId){

    userId = crypto.randomUUID();

    localStorage.setItem(
        "userId",
        userId
    );

}



let username = localStorage.getItem("chatName");


if(!username){

    username =
    prompt("نام خود را وارد کنید")
    ||
    "کاربر";


    localStorage.setItem(
        "chatName",
        username
    );

}



document.getElementById("myName")
.innerText=username;



// ثبت کاربر

usersRef.doc(userId).set({

    name:username,

    online:true,

    lastSeen:
    firebase.firestore.FieldValue.serverTimestamp()


},
{
merge:true
});




// هر 20 ثانیه وضعیت را تازه کن

setInterval(()=>{


usersRef.doc(userId).update({

    online:true,

    lastSeen:
    firebase.firestore.FieldValue.serverTimestamp()


});


},20000);




// خروج

window.addEventListener(
"beforeunload",
()=>{


usersRef.doc(userId).update({

online:false,

lastSeen:
firebase.firestore.FieldValue.serverTimestamp()

});


});

// ورود


setTimeout(()=>{


document.getElementById("loading")
.classList.add("hidden");


document.getElementById("publicPage")
.classList.remove("hidden");


},1000);







// تغییر نام


function changeName(){


let n = prompt("نام جدید");


if(n){


username=n;


localStorage.setItem("chatName",n);


document.getElementById("myName")
.innerText=n;


usersRef.doc(userId).update({

name:n

});


}


}







// ارسال عمومی


function sendPublic(){


let input=document.getElementById("publicInput");


let text=input.value.trim();


if(!text)return;



messagesRef.add({

name:username,

text:text,

userId:userId,

type:"public",

receiverId:"",

seenBy:[],

time:
firebase.firestore.FieldValue.serverTimestamp()

});


input.value="";


}








// نمایش عمومی


messagesRef
.orderBy("time","asc")
.onSnapshot(snapshot=>{


let box=document.getElementById("publicMessages");


box.innerHTML="";



snapshot.forEach(doc=>{


let m=doc.data();


if(m.type==="public"){



let tick="";


let del="";



if(m.userId===userId){


tick = m.seen ? "✔✔" : "✅";



del=`

<button class="delete"
onclick="deleteMessage('${doc.id}')">

❌

</button>

`;



}



box.innerHTML += `


<div class="msg">


<div class="name">

${m.name}

</div>



<div>

${m.text}

</div>



<div class="actions">

<span class="tick">

${tick}

</span>


${del}

</div>


</div>



`;



}



});


});









// خصوصی



let selectedUser=null;



function openPrivate(){


document.getElementById("publicPage")
.classList.add("hidden");


document.getElementById("privatePage")
.classList.remove("hidden");


}





function backPublic(){


document.getElementById("privatePage")
.classList.add("hidden");


document.getElementById("publicPage")
.classList.remove("hidden");


}







// لیست کاربران



usersRef.onSnapshot(snapshot=>{


let list=document.getElementById("userList");


list.innerHTML="";


snapshot.forEach(doc=>{


let u=doc.data();



if(doc.id!==userId){



list.innerHTML += `


<div class="user"
onclick="selectUser('${doc.id}','${u.name}')">


${u.name}


</div>



`;



}



});



});









function selectUser(id,name){


selectedUser={

id:id,

name:name

};



document.getElementById("privateTitle")
.innerText="چت با "+name;



loadPrivate();


}









function sendPrivate(){


if(!selectedUser){

alert("کاربر انتخاب نشده");

return;

}



let input=document.getElementById("privateInput");


let text=input.value.trim();


if(!text)return;



messagesRef.add({

name:username,

text:text,

userId:userId,

receiverId:selectedUser.id,

type:"private",

seen:false,

time:firebase.firestore.FieldValue.serverTimestamp()


});


input.value="";


}










function loadPrivate(){


messagesRef
.orderBy("time","asc")
.onSnapshot(snapshot=>{


let box=document.getElementById("privateMessages");


box.innerHTML="";



snapshot.forEach(doc=>{


let m=doc.data();



if(
m.type==="private"
&&
(
(m.userId===userId && m.receiverId===selectedUser.id)
||
(m.userId===selectedUser.id && m.receiverId===userId)
)
){



// خوانده شدن

if(
m.receiverId===userId &&
m.seen===false
){

messagesRef.doc(doc.id)
.update({

seen:true

});

}





let tick="";


let del="";


if(m.userId===userId){


tick=m.seen ? "✔✔" : "✅";


del=`

<button class="delete"

onclick="deleteMessage('${doc.id}')">

❌

</button>


`;

}



box.innerHTML +=`


<div class="msg">


<div class="name">

${m.name}

</div>


<div>

${m.text}

</div>



<div class="actions">

<span class="tick">

${tick}

</span>


${del}


</div>


</div>


`;



}



});



box.scrollTop=box.scrollHeight;



});



}







// حذف پیام



function deleteMessage(id){


if(!confirm("پیام حذف شود؟"))
return;



messagesRef.doc(id)
.get()
.then(doc=>{


if(!doc.exists)
return;



let data=doc.data();



if(data.userId !== userId){

alert("این پیام متعلق به شما نیست");

return;

}



messagesRef.doc(id)
.delete();



});


  }



</script>


</body>

  </html>
