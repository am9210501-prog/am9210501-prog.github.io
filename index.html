<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRN Chat Pro - با حذف و ریپلای</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
body, html{margin:0;padding:0;font-family:'Vazirmatn',tahoma;background:#0b1a2f;color:white;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
#loadingScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0b1a2f;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;}
#loadingScreen h1{font-size:32px;margin:10px;text-align:center;}
#loadingScreen p{font-size:18px;color:#aaa;margin-top:5px;text-align:center;}
#publicView,#privateView{flex:1;display:flex;flex-direction:column;padding:10px;overflow:hidden;}
.messages{flex:1;overflow-y:auto;padding:5px;border-radius:6px;background:#111;margin-bottom:5px;}
.msg{background:#222;margin:5px;padding:5px;border-radius:6px;position:relative;animation:fade .3s;display:flex;justify-content:space-between;align-items:center;}
.msg .reactions span{cursor:pointer;margin-left:5px;}
.msg .reply-box{background:#333;padding:3px;font-size:12px;color:#fff3cd;margin-bottom:3px;border-radius:3px;}
.chat-input{display:flex;}
.chat-input input{flex:1;padding:10px;border-radius:6px;border:none;margin-right:5px;}
.chat-input button{padding:10px;border:none;border-radius:6px;background:#00aaff;color:white;cursor:pointer;}
#privateBtn,#backBtn{padding:15px;margin:5px;border:none;border-radius:8px;background:#0d6efd;color:white;font-size:16px;cursor:pointer;}
.sidebar{width:250px;background:#111;border-right:1px solid #444;display:flex;flex-direction:column;overflow-y:auto;}
.sidebar h3{margin:5px;padding:5px;border-bottom:1px solid #444;}
.sidebar .userItem{padding:5px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.sidebar .userItem:hover{background:#0d6efd;}
.online-dot{width:10px;height:10px;border-radius:50%;background:#0f0;display:inline-block;margin-left:5px;}
.unread-count{background:red;color:white;border-radius:50%;padding:2px 6px;margin-left:5px;font-size:12px;}
.privateChatWindow{flex:1;display:flex;flex-direction:column;}
.ticks{margin-left:5px;font-size:12px;color:#0f0;}
.sent{color:#aaa;}
.seen{color:#0f0;}
.msg button{margin-left:5px;background:#555;color:white;border:none;border-radius:3px;cursor:pointer;padding:2px 5px;font-size:12px;}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1}}

/* FINAL MOBILE + NOTICE FIX */
html,body{width:100%;height:100%;overflow:hidden}
body{min-height:100dvh}
.page{height:100dvh;min-height:0}
.messages{min-height:0;overscroll-behavior:contain}
.private,.chat{min-height:0}
.private{height:100%}
.chat{height:100%;min-width:0;overflow:hidden}
.chat .messages{min-height:0}
.box{flex:0 0 auto}
.notice-box{
  flex:0 0 auto;margin:8px 0 0;padding:10px 12px;border-radius:10px;
  background:linear-gradient(135deg,#173b5b,#24577e);
  border:1px solid rgba(255,255,255,.12);color:#fff;font-size:13px;line-height:1.9
}
.notice-box strong{display:block;font-size:14px;margin-bottom:2px}
@media(max-width:700px){
  .page{padding:6px}.private{gap:6px}
  .users{width:112px;flex:0 0 112px}
  .user{padding:9px 7px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat .header{padding:8px;margin-bottom:5px;font-size:13px}
  .messages{padding:6px}.msg{padding:8px;font-size:13px}
  .box{gap:5px;margin-top:6px}
  .box input{min-width:0;height:42px;font-size:14px}
  .box button{height:42px;padding:7px 10px;flex:0 0 auto}
  #privatePage .chat>button{flex:0 0 auto;height:38px;margin-top:5px}
  .notice-box{padding:8px 10px;font-size:12px}
}

</style>
</head>
<body>

<div id="loadingScreen">
  <h1>پیام‌رسانی ساده برای همه</h1>
  <p>«سرعت، امنیت، ارتباط»</p>
</div>

<div id="publicView" style="display:none;">
  <div>👤 <strong id="displayName"></strong> <button onclick="changeName()">تغییر نام</button></div>
  <div id="typingStatus" style="font-size:12px;color:#aaa;"></div>
  <div class="messages" id="messagesPublic"></div>
  <div class="chat-input">
    <input id="text" placeholder="پیام عمومی...">
    <button onclick="sendPublicMessage()">ارسال</button>
  </div>
  <button id="privateBtn">💬 چت خصوصی <span id="unreadPrivateCount" class="unread-count" style="display:none">0</span></button>
</div>

<div id="privateView" style="display:none;flex:1;flex-direction:row;">
  <div class="sidebar">
    <h3>چت خصوصی</h3>
    <input id="privateSearch" placeholder="جستجو کاربران" style="margin:5px;padding:5px;border-radius:5px;border:none;">
    <div id="privateUserList"></div>
    <button id="backBtn">بازگشت به عمومی</button>
  </div>
  <div class="privateChatWindow">
    <div id="privateChatContainer" style="flex:1;display:flex;flex-direction:column;">
      <div class="messages" id="privateMessages"></div>
      <div class="chat-input">
        <input id="privateText" placeholder="پیام خصوصی...">
        <button onclick="sendPrivateMessage()">ارسال</button>
      </div>
    </div>
  </div>
</div>

<audio id="notifSound" src="https://actions.google.com/sounds/v1/alarms/notification_simple-02.mp3"></audio>

<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyCzLno3kea6Ab4hXLsj9HZ9SJoTSDIuogk",
 authDomain:"irn-chat-pro.firebaseapp.com",
 projectId:"irn-chat-pro",
 storageBucket:"irn-chat-pro.firebasestorage.app",
 messagingSenderId:"1084279461221",
 appId:"1:1084279461221:web:2fb3ab923e3de7b9e0fd8c"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const messages=db.collection("messages"), users=db.collection("users"), typing=db.collection("typing");
const uid=localStorage.getItem("irnUid")||crypto.randomUUID();
localStorage.setItem("irnUid",uid);
let name=localStorage.getItem("chatName")||"";
let selected=null, pubReply=null, privReply=null;
let unsubPub=null, unsubPriv=null, unsubUsers=null, unsubTyping=null, heartbeat=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ts=()=>firebase.firestore.FieldValue.serverTimestamp();
const toast=t=>{let e=$("irnToast");if(!e){e=document.createElement("div");e.id="irnToast";document.body.appendChild(e)}e.textContent=t;e.style.display="block";clearTimeout(window.__t);window.__t=setTimeout(()=>e.style.display="none",2200)};
function conn(text,cls){let e=$("connectionStatus");if(e){e.textContent=text;e.className=cls||""}}
function nameOK(n){return n.length>=3&&n.length<=30&&!/[<>]/.test(n)}

async function login(){
 const input=$("authUsername")||$("usernameInput")||document.querySelector('input[placeholder*="نام"]');
 const err=$("authError");
 const n=(input?.value||"").trim();
 if(!nameOK(n)){if(err)err.textContent="نام کاربری باید بین ۳ تا ۳۰ کاراکتر باشد.";return}
 try{
  const q=await users.where("name","==",n).limit(10).get();
  if(q.docs.some(d=>d.id!==uid)){if(err)err.textContent="این نام کاربری قبلاً استفاده شده است.";return}
  name=n;localStorage.setItem("chatName",name);
  await users.doc(uid).set({userId:uid,name,online:true,lastSeen:ts(),updatedAt:ts()},{merge:true});
  showMain();start();
 }catch(e){console.error(e);if(err)err.textContent="دسترسی Firebase اجازه ورود نمی‌دهد."}
}
function showMain(){
 $("loadingScreen")?.classList.add("hidden");
 $("publicView")?.classList.remove("hidden");
 document.querySelectorAll("[data-display-name]").forEach(e=>e.textContent=name);
 const dn=$("displayName");if(dn)dn.textContent=name;
}
function start(){
 conn("🟢 متصل","connected");
 heartbeat=setInterval(()=>users.doc(uid).set({online:true,lastSeen:ts()},{merge:true}).catch(()=>{}),20000);
 users.doc(uid).set({online:true,lastSeen:ts()},{merge:true});
 listenPublic();listenUsers();listenTyping();
}
function listenPublic(){
 unsubPub?.();
 unsubPub=messages.onSnapshot(s=>{
  const a=s.docs.filter(d=>d.data().type!=="private")
   .sort((x,y)=>(x.data().time?.toMillis?.()||0)-(y.data().time?.toMillis?.()||0));
  renderMessages($("messagesPublic")||$("messages"),a,"public");
 },e=>{console.error(e);conn("🟡 خطای دسترسی","")});
}
function listenUsers(){
 unsubUsers?.();
 unsubUsers=users.onSnapshot(s=>{
  window.userCache=s.docs.filter(d=>d.id!==uid).map(d=>({id:d.id,...d.data()}));
  renderUsers();
 },console.error);
}
function online(u){const t=u.lastSeen?.toMillis?.()||0;return !!u.online&&t&&Date.now()-t<45000}
function renderUsers(){
 const box=$("privateUserList")||$("userList");if(!box)return;
 const q=($("privateSearch")?.value||"").trim().toLowerCase();
 box.innerHTML="";
 (window.userCache||[]).filter(u=>(u.name||"").toLowerCase().includes(q)).forEach(u=>{
  const d=document.createElement("button");d.className="userItem";
  d.innerHTML=`<span class="${online(u)?"online-dot":"offline-dot"}"></span>${esc(u.name)}${online(u)?"":" <small>آفلاین</small>"}`;
  d.onclick=()=>openPrivate(u);
  box.appendChild(d);
 });
}
function openPrivate(u){
 selected=u;
 if($("privateTitle"))$("privateTitle").textContent="چت با "+u.name;
 $("publicView")?.classList.add("hidden");$("privateView")?.classList.remove("hidden");
 listenPrivate();markSeen();
}
function listenPrivate(){
 unsubPriv?.();
 if(!selected)return;
 unsubPriv=messages.onSnapshot(s=>{
  const a=s.docs.filter(d=>{
   const m=d.data();
   return m.type==="private"&&((m.userId===uid&&m.receiverId===selected.id)||(m.userId===selected.id&&m.receiverId===uid));
  }).sort((x,y)=>(x.data().time?.toMillis?.()||0)-(y.data().time?.toMillis?.()||0));
  renderMessages($("privateMessages")||$("privateChat"),a,"private");
 },console.error);
}
async function markSeen(){
 if(!selected)return;
 const s=await messages.where("receiverId","==",uid).get();
 const b=db.batch();let n=0;
 s.forEach(d=>{const m=d.data();if(m.userId===selected.id&&!m.seen){b.update(d.ref,{seen:true});n++}});
 if(n)await b.commit();
}
function when(t){return t?.toDate?.().toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"})||""}
function msgHTML(m,id,room){
 const mine=m.userId===uid, r=m.reactions||{};
 const seen=mine?(m.seen?"✔✔":"✓"):"";
 const react=["👍","❤️","😂","🔥","😢","😡"].map(x=>`<button data-react="${id}" data-emoji="${x}">${x}${r[x]?` ${r[x]}`:""}</button>`).join("");
 return `<div class="msg ${mine?"mine":""}" data-id="${id}">
  <div class="msg-head"><b>${esc(m.name)}</b><span>${when(m.time)}</span></div>
  ${m.replyTo?`<div class="reply-preview">↩ ${esc(m.replyTo.text)}</div>`:""}
  <div class="msg-body">${esc(m.text)}${m.edited?" <small>(ویرایش‌شده)</small>":""}</div>
  <div class="msg-actions">${mine?`<button data-edit="${id}">✏️</button><button data-del="${id}">🗑️</button>`:""}<button data-reply="${id}" data-room="${room}">↩️</button><span>${seen}</span></div>
  <div class="reaction-row">${react}</div>
  <small class="expire" data-time="${m.time?.toMillis?.()||0}"></small>
 </div>`;
}
function renderMessages(box,docs,room){
 if(!box)return;
 box.innerHTML=docs.map(d=>msgHTML(d.data(),d.id,room)).join("");
 box.scrollTop=box.scrollHeight;bindActions(box);
 updateTimers();
}
function bindActions(box){
 box.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{try{await messages.doc(b.dataset.del).delete();toast("پیام حذف شد")}catch(e){toast("حذف پیام در قوانین Firebase مجاز نیست")}});
 box.querySelectorAll("[data-edit]").forEach(b=>b.onclick=async()=>{
  const s=await messages.doc(b.dataset.edit).get(),m=s.data();if(!m||m.userId!==uid)return;
  const t=prompt("ویرایش پیام:",m.text);if(t?.trim()&&t.trim()!==m.text)await messages.doc(b.dataset.edit).update({text:t.trim(),edited:true,editedAt:ts()});
 });
 box.querySelectorAll("[data-reply]").forEach(b=>b.onclick=async()=>{
  const m=(await messages.doc(b.dataset.reply).get()).data();if(!m)return;
  const obj={name:m.name,text:m.text};
  if(b.dataset.room==="public"){pubReply=obj;toast("حالت پاسخ فعال شد")}
  else{privReply=obj;toast("حالت پاسخ فعال شد")}
 });
 box.querySelectorAll("[data-react]").forEach(b=>b.onclick=()=>messages.doc(b.closest(".msg").dataset.id).set({reactions:{[b.dataset.emoji]:firebase.firestore.FieldValue.increment(1)}},{merge:true}));
}
function updateTimers(){
 document.querySelectorAll(".expire").forEach(e=>{
  const t=Number(e.dataset.time);if(!t)return;
  const left=Math.max(0,86400000-(Date.now()-t));
  const h=Math.floor(left/3600000),m=Math.floor(left%3600000/60000),s=Math.floor(left%60000/1000);
  e.textContent=`محو در ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
 });
}
setInterval(updateTimers,1000);

async function send(room){
 const input=room==="public"?($("text")||$("messageInput")):($("privateText")||$("privateInput"));
 const text=(input?.value||"").trim();if(!text)return;
 try{
  if(room==="private"&&!selected){toast("یک کاربر را انتخاب کن");return}
  await messages.add({type:room==="public"?"public":"private",name,text,userId:uid,uid,receiverId:room==="private"?selected.id:null,seen:false,time:ts(),replyTo:room==="public"?pubReply:privReply,reactions:{}});
  input.value="";if(room==="public")pubReply=null;else privReply=null;
 }catch(e){console.error(e);toast("ارسال پیام انجام نشد؛ Rules Firebase را بررسی کن")}
}
function bind(id,fn){const e=$(id);if(e)e.onclick=fn}
bind("sendPublicBtn",()=>send("public"));bind("sendBtn",()=>send("public"));bind("sendPrivateBtn",()=>send("private"));bind("privateSendBtn",()=>send("private"));
["text","messageInput","privateText","privateInput"].forEach(id=>{const e=$(id);if(e)e.addEventListener("keydown",x=>{if(x.key==="Enter"&&!x.shiftKey){x.preventDefault();send(id.includes("private")?"private":"public")}})});

const search=$("privateSearch");if(search)search.oninput=renderUsers;
bind("privateBtn",()=>{$("publicView")?.classList.add("hidden");$("privateView")?.classList.remove("hidden");renderUsers()});
bind("backBtn",()=>{$("privateView")?.classList.add("hidden");$("publicView")?.classList.remove("hidden")});

function typingSet(room,to,active){
 const id=room==="public"?"public_"+uid:"private_"+uid+"_"+to;
 typing.doc(id).set({userId:uid,name,room,receiverId:to||null,active,expiresAt:Date.now()+2500},{merge:true}).catch(()=>{});
}
function listenTyping(){
 unsubTyping?.();unsubTyping=typing.onSnapshot(s=>{
  let pub="",priv="";
  s.forEach(d=>{const m=d.data();if(!m.active||m.expiresAt<Date.now()||m.userId===uid)return;if(m.room==="public")pub=m.name+" در حال نوشتن...";if(m.room==="private"&&selected&&m.userId===selected.id)priv=m.name+" در حال نوشتن..."});
  if($("typingStatus"))$("typingStatus").textContent=pub;
  if($("privateTyping"))$("privateTyping").textContent=priv;
 });
}
function bindType(id,room){const e=$(id);if(!e)return;e.oninput=()=>{const to=room==="private"?selected?.id:null;if(room==="private"&&!to)return;typingSet(room,to,true);clearTimeout(e.__typing);e.__typing=setTimeout(()=>typingSet(room,to,false),1800)}}
bindType("text","public");bindType("messageInput","public");bindType("privateText","private");bindType("privateInput","private");

window.addEventListener("online",()=>conn("🟢 متصل","connected"));
window.addEventListener("offline",()=>conn("🔴 آفلاین","offline"));
window.addEventListener("beforeunload",()=>users.doc(uid).set({online:false,lastSeen:ts()},{merge:true}).catch(()=>{}));

if($("authSubmit"))$("authSubmit").onclick=login;
else if($("guestEnter"))$("guestEnter").onclick=login;
else {
 const inp=$("authUsername")||document.querySelector('input[placeholder*="نام"]');
 const btn=document.querySelector('button.primary,button');
 if(inp&&btn)btn.onclick=login;
}
if(name){
 users.doc(uid).get().then(s=>{
  if(s.exists&&s.data().name===name){showMain();start()}else{$("loadingScreen")?.classList.remove("hidden")}
 }).catch(()=>{$("loadingScreen")?.classList.remove("hidden")});
}else{$("loadingScreen")?.classList.remove("hidden")}
conn("🟡 در حال اتصال","");
</script>
</body></html>
