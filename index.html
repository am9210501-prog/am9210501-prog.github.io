<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GapChat Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        // وارد کردن Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, doc, setDoc, updateDoc, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // 🛑 مشخصات فایربیس خودت را اینجا جایگزین کن 🛑
        const firebaseConfig = {
  apiKey: "AIzaSyCzLno3kea6Ab4hXLsj9HZ9SJoTSDIuogk",
  authDomain: "irn-chat-pro.firebaseapp.com",
  projectId: "irn-chat-pro",
  storageBucket: "irn-chat-pro.firebasestorage.app",
  messagingSenderId: "1084279461221",
  appId: "1:1084279461221:web:2fb3ab923e3de7b9e0fd8c"
};
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // متغیرهای سراسری برنامه
        let currentUser = null;
        let activeChatId = 'public'; // حالت پیش‌فرض چت عمومی
        let isPrivateChat = false;
        let recipientId = null;

        // عناصر DOM
        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const userList = document.getElementById('user-list');
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const chatTitle = document.getElementById('chat-title');
        const usernameInput = document.getElementById('username-input');

        // --- تابع ورود و تنظیم پروفایل ---
        async function login() {
            const name = usernameInput.value.trim();
            if (!name) return alert("نام را وارد کنید");

            try {
                const userCredential = await signInAnonymously(auth);
                currentUser = userCredential.user;

                // ذخیره کاربر در Firestore
                await setDoc(doc(db, "users", currentUser.uid), {
                    uid: currentUser.uid,
                    displayName: name,
                    isOnline: true,
                    lastSeen: serverTimestamp()
                });

                loginScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');
                startApp();
            } catch (error) {
                console.error("Error logging in:", error);
            }
        }

        // --- شروع اپلیکیشن ---
        function startApp() {
            loadUsers();
            loadMessages();
            // مدیریت وضعیت آنلاین بودن
            setInterval(updateOnlineStatus, 30000); 
        }

        async function updateOnlineStatus() {
            if (currentUser) {
                await updateDoc(doc(db, "users", currentUser.uid), { isOnline: true });
            }
        }

        // --- بارگذاری لیست کاربران ---
        function loadUsers() {
            const q = query(collection(db, "users"));
            onSnapshot(q, (snapshot) => {
                userList.innerHTML = `
                    <div onclick="window.switchChat('public')" class="p-3 hover:bg-gray-700 cursor-pointer flex justify-between items-center ${activeChatId === 'public' ? 'bg-gray-700' : ''}">
                        <span>📢 چت عمومی</span>
                    </div>
                `;

                snapshot.forEach((docSnap) => {
                    const user = docSnap.data();
                    if (user.uid !== currentUser.uid) {
                        const userDiv = document.createElement('div');
                        userDiv.className = `p-3 hover:bg-gray-700 cursor-pointer flex justify-between items-center ${recipientId === user.uid ? 'bg-gray-700' : ''}`;
                        userDiv.innerHTML = `
                            <div class="flex items-center">
                                <span class="w-3 h-3 rounded-full ${user.isOnline ? 'bg-green-500' : 'bg-gray-500'} ml-2"></span>
                                <span>${user.displayName}</span>
                            </div>
                        `;
                        userDiv.onclick = () => switchChat('private', user.uid, user.displayName);
                        userList.appendChild(userDiv);
                    }
                });
            });
        }

        // --- سوئیچ بین چت عمومی و خصوصی ---
        window.switchChat = (type, targetId = null, targetName = '') => {
            isPrivateChat = (type === 'private');
            recipientId = targetId;
            activeChatId = isPrivateChat ? `chat_${getChatId(currentUser.uid, targetId)}` : 'public';
            chatTitle.innerText = isPrivateChat ? targetName : "چت عمومی";
            loadMessages();
        };

        // تابع برای ساخت یک ID یکتا برای دو نفر (برای چت خصوصی)
        function getChatId(id1, id2) {
            return [id1, id2].sort().join('_');
        }

        // --- بارگذاری پیام‌ها ---
        function loadMessages() {
            messagesContainer.innerHTML = '';
            let q;

            if (!isPrivateChat) {
                // کوئری چت عمومی
                q = query(collection(db, "messages"), where("chatId", "==", "public"), orderBy("timestamp", "asc"));
            } else {
                // کوئری چت خصوصی
                const chatId = `chat_${getChatId(currentUser.uid, recipientId)}`;
                q = query(collection(db, "messages"), where("chatId", "==", chatId), orderBy("timestamp", "asc"));
            }

            onSnapshot(q, (snapshot) => {
                messagesContainer.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const isMe = msg.senderId === currentUser.uid;
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `mb-4 flex ${isMe ? 'justify-end' : 'justify-start'}`;
                    msgDiv.innerHTML = `
                        <div class="${isMe ? 'bg-blue-600 text-white' : 'bg-gray-600 text-white'} px-4 py-2 rounded-lg max-w-xs">
                            <p class="text-sm">${msg.text}</p>
                        </div>
                    `;
                    messagesContainer.appendChild(msgDiv);
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        // --- ارسال پیام ---
        window.sendMessage = async () => {
            const text = messageInput.value.trim();
            if (!text) return;

            const chatId = isPrivateChat ? `chat_${getChatId(currentUser.uid, recipientId)}` : 'public';

            await addDoc(collection(db, "messages"), {
                chatId: chatId,
                senderId: currentUser.uid,
                senderName: (await getDocOnceUser()).displayName,
                text: text,
                timestamp: serverTimestamp()
            });

            messageInput.value = '';
        };

        async function getDocOnceUser() {
            // تابع کمکی برای گرفتن نام کاربر فعلی
            const userDoc = await getDocs(query(collection(db, "users"), where("uid", "==", currentUser.uid)));
            return { displayName: userDoc.docs[0].data().displayName };
        }

        // اتصال دکمه‌ها به توابع
        window.login = login;
        window.sendMessage = sendMessage;
        window.sendMessageKeyPress = (e) => { if(e.key === 'Enter') sendMessage(); };

    </script>
    <style>
        body { font-family: Tahoma, sans-serif; }
        #messages::-webkit-scrollbar { width: 5px; }
        #messages::-webkit-scrollbar-thumb { background: #4a5568; }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen overflow-hidden">

    <!-- صفحه ورود -->
    <div id="login-screen" class="flex flex-col items-center justify-center h-full p-4">
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md">
            <h1 class="text-3xl font-bold mb-6 text-center text-blue-500">GapChat Pro</h1>
            <input id="username-input" type="text" placeholder="نام کاربری خود را وارد کنید..." class="w-full p-3 mb-4 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 outline-none">
            <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded font-bold transition">ورود به برنامه</button>
        </div>
    </div>

    <!-- صفحه اصلی چت -->
    <div id="chat-screen" class="hidden flex h-full">
        
        <!-- سایدبار کاربران (سمت راست در RTL) -->
        <div class="w-1/4 bg-gray-800 border-l border-gray-700 flex flex-col">
            <div class="p-4 font-bold text-xl border-b border-gray-700 text-blue-400">کاربران آنلاین</div>
            <div id="user-list" class="flex-1 overflow-y-auto">
                <!-- لیست کاربران اینجا ساخته می‌شود -->
            </div>
        </div>

        <!-- بخش چت (وسط) -->
        <div class="flex-1 flex flex-col">
            <!-- هدر چت -->
            <div class="p-4 bg-gray-800 border-b border-gray-700 flex justify-between items-center">
                <h2 id="chat-title" class="text-lg font-bold">چت عمومی</h2>
                <span class="text-xs text-gray-400">GapChat v5.6</span>
            </div>

            <!-- پیام‌ها -->
            <div id="messages" class="flex-1 overflow-y-auto p-4 bg-gray-900">
                <!-- پیام‌ها اینجا ساخته می‌شوند -->
            </div>

            <!-- ورودی پیام -->
            <div class="p-4 bg-gray-800 flex gap-2">
                <input id="message-input" type="text" onkeypress="sendMessageKeyPress(event)" placeholder="پیام خود را بنویسید..." class="flex-1 p-3 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 outline-none">
                <button onclick="sendMessage()" class="bg-blue-600 px-6 py-2 rounded font-bold hover:bg-blue-700">ارسال</button>
            </div>
        </div>
    </div>

</body>
</html>
